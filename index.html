<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="color-scheme" content="dark light">
<title>Stacks — PAL's Academy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23114E40'/><path d='M8 20h16M8 15h16M8 10h10' stroke='%23C99A2A' stroke-width='2.5' stroke-linecap='round'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C110F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stacks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="app/icons/apple-touch-icon.png">
<link rel="stylesheet" href="app/css/app.css">
<link rel="stylesheet" href="app/css/reels.css">
</head>
<body>

<div id="app" class="app">

  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="sidebar">
    <a class="brand" href="#/feed">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="var(--primary)"/><path d="M8 21h16M8 16h16M8 11h10" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>Stacks</strong>
        <small>PAL's Academy</small>
      </span>
    </a>

    <nav class="nav" id="nav">
      <a href="#/feed"    data-route="feed"><i data-ico="feed"></i>Feed</a>
      <a href="#/explore" data-route="explore"><i data-ico="explore"></i>Explore</a>
      <a href="#/review"  data-route="review"><i data-ico="review"></i>Review<span class="pill" id="due-pill" hidden>0</span></a>
      <a href="#/stash"   data-route="stash"><i data-ico="stash"></i>My Stash</a>
      <a href="#/paths"   data-route="paths"><i data-ico="paths"></i>Paths</a>
      <a href="#/stats"   data-route="stats"><i data-ico="stats"></i>Progress</a>
    </nav>

    <div class="sidebar-goal" id="sidebar-goal"></div>

    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-sm" id="btn-new"><i data-ico="plus"></i>New idea</button>
      <div class="row">
        <button class="icon-btn" id="btn-theme" title="Toggle theme (t)"><i data-ico="theme"></i></button>
        <a class="icon-btn" href="#/settings" title="Settings"><i data-ico="cog"></i></a>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menu"><i data-ico="menu"></i></button>
      <div class="search">
        <i data-ico="search"></i>
        <input id="search" type="search" placeholder="Search 900+ ideas — try &ldquo;vagus&rdquo;, &ldquo;deadlift&rdquo;, &ldquo;dopamine&rdquo;&hellip;" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="topbar-right">
        <div class="streak" id="streak" title="Current streak"></div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<!-- ============ READER OVERLAY ============ -->
<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <button class="icon-btn" id="reader-close" aria-label="Close (Esc)"><i data-ico="x"></i></button>
    <div class="reader-progress"><span id="reader-progress-bar"></span></div>
    <div class="reader-count" id="reader-count"></div>
  </div>
  <div class="reader-body" id="reader-body"></div>
  <div class="reader-nav">
    <button class="btn btn-ghost" id="reader-prev"><i data-ico="up"></i>Prev</button>
    <div class="reader-acts" id="reader-acts"></div>
    <button class="btn btn-ghost" id="reader-next">Next<i data-ico="down"></i></button>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-wrap" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" id="modal-inner"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<!-- mobile bottom nav -->
<nav class="botnav only-mobile">
  <a href="#/feed"    data-route="feed"><i data-ico="feed"></i><span>Feed</span></a>
  <a href="#/explore" data-route="explore"><i data-ico="explore"></i><span>Explore</span></a>
  <a href="#/review"  data-route="review"><i data-ico="review"></i><span>Review</span></a>
  <a href="#/stash"   data-route="stash"><i data-ico="stash"></i><span>Stash</span></a>
  <a href="#/stats"   data-route="stats"><i data-ico="stats"></i><span>You</span></a>
</nav>

<!-- ============ LIBRARY (content) ============ -->
<script src="app/js/library.js"></script>
<script src="app/data/references.js"></script>
<script src="app/data/medicine.js"></script>
<script src="app/data/anatomy.js"></script>
<script src="app/data/physiology.js"></script>
<script src="app/data/kinesiology.js"></script>
<script src="app/data/nutrition.js"></script>
<script src="app/data/recovery.js"></script>
<script src="app/data/mind.js"></script>
<script src="app/data/behavior.js"></script>
<script src="app/data/influence.js"></script>
<script src="app/data/wisdom.js"></script>
<script src="app/data/world.js"></script>
<script src="app/data/medicine2.js"></script>
<script src="app/data/bodywork2.js"></script>
<script src="app/data/health2.js"></script>
<script src="app/data/psyche2.js"></script>
<script src="app/data/world2.js"></script>

<!-- ============ APP ============ -->
<script src="app/js/icons.js"></script>
<script src="app/js/store.js"></script>
<script src="app/js/srs.js"></script>
<script src="app/js/ui.js"></script>
<script src="app/js/reels.js"></script>
<script src="app/js/views.js"></script>
<script src="app/js/app.js"></script>
<script>
// Offline support. Service workers need http(s); on file:// the app still runs, just online-only.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e =>
    console.warn('[PAL] offline cache unavailable:', e.message)));
}
</script>
</body>
</html>
